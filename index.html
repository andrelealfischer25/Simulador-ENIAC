<!DOCTYPE html>
<html lang="pt-br">
<head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <meta charset="UTF-8">
  <title>Simulador ENIAC</title>
  <style>
    body { background:#494949; color:#fff; font-family:"Press Start 2P",monospace; text-align:center; }
    h1 { color:#f8df00; margin-top:20px; font-size: 20px; letter-spacing: 2px;; }
    #eniac {
      width:900px; 
      height:500px; 
      margin:30px auto; 
      background:#000;
      border:4px solid #f8df00; 
      border-radius:10px; 
      box-shadow:0 0 25px #000;
      display:grid; 
      grid-template-columns: repeat(10, 1fr);
      justify-items:center;
       padding:15px; 
       overflow:hidden;
    }
    .led{ 
      width:14px; 
      height:14px; 
      background:#f8df00; 
      border-radius:0px;
      margin:4px; 
      opacity:0.15; 
      transition:opacity .25s, box-shadow .25s; }
    .led.aceso{ 
      opacity:1; 
      box-shadow:0 0 10px #f8df00; }
    #sinal{ 
      display:flex; 
      align-items:center; 
      justify-content:center; 
      gap:10px; margin-top:25px; }
    .led-sinal{ 
      width:20px; 
      height:20px; 
      background:#f00; 
      border-radius:0px; 
      opacity:0.2; 
      box-shadow:0 0 10px #000; 
      transition:opacity .25s, box-shadow .25s; }
    .led-sinal.aceso{ 
      opacity:1; 
      box-shadow:0 0 20px #f00; }
    #controles{ margin-top:40px; }
    input, select, button { padding:8px 12px; margin:8px; border:none; border-radius:5px; background:#575757; color:#f8df00; font-size:18px; }
    button{ cursor:pointer; border:2px solid #f8df00; }
    button:hover{ background:#f8df00; color:#333; }
    #hud{ margin-top:25px; font-size:14px; letter-spacing: 1px;; color:#f8df00; }
    /* legenda pequena para facilitar leitura (opcional) */
    .legenda-row { font-size:17px; color:#f8df00; margin-top:12px; }
  </style>
</head>
<body>
  <h1>Simulador ENIAC</h1>

  <div id="eniac"></div>

  <div id="sinal">
    <div class="led-sinal" id="ledNegativo"></div>
    <label>SINAL (-)</label>
  </div>

  <div id="controles">
    <input type="number" id="num1" placeholder="Número 1">
    <select id="op">
      <option value="add">+</option>
      <option value="sub">-</option>
      <option value="mul">×</option>
      <option value="div">÷</option>
      <option value="sqrt">√</option>
    </select>
    <input type="number" id="num2" placeholder="Número 2">
    <button onclick="executar()">Executar</button>
  </div>

  <div id="hud"></div>
  <div class="legenda-row">Desenvolvido por André Leal e Otavio Henrique</div>

  <script>
    const eniac = document.getElementById("eniac");

    const colunas = 10;  // casas decimais (unidade, dezena, ...)
    const linhas = 10;   // dígitos 0..9 (topo -> 0, baixo -> 9)

    // vamos criar os elementos no DOM em ordem row-major (linha por linha)
    // mas manter uma matriz indexável por [coluna][linha] para ficar natural: leds[coluna][linha]
    const leds = Array.from({ length: colunas }, () => []); // array de colunas

    for (let r = 0; r < linhas; r++) {          // r = 0 (topo, dígito 0) ... 9 (embaixo)
      for (let c = 0; c < colunas; c++) {      // c = 0 (coluna 1 - UNIDADES) ... 9
        const led = document.createElement("div");
        led.classList.add("led");
        eniac.appendChild(led);
        // armazena no mapa por coluna, linha: leds[coluna][linha] com linha 0 => topo
        leds[c][r] = led;
      }
    }

    function limparLeds() {
      // remove classe de todos os leds
      for (let c = 0; c < colunas; c++) {
        for (let r = 0; r < linhas; r++) {
          leds[c][r].classList.remove("aceso");
        }
      }
    }

    // Exibe número com UNIDADES na primeira coluna (c=0, esquerda),
    // dezenas na coluna 1, etc.
    // dígitos 0..9 correspondem a linhas 0..9 (topo para baixo)
    function exibirNumero(num) {
      limparLeds();
      const inteiro = Math.abs(Math.floor(num));
      const str = inteiro.toString();

      // percorrer do último caractere (unidade) para o primeiro
      for (let i = 0; i < str.length; i++) {
        const digitoChar = str[str.length - 1 - i]; // pega da direita (unidade)
        const digito = parseInt(digitoChar, 10);
        const coluna = i; // unidades => coluna 0, dezenas => coluna 1, ...
        if (coluna >= colunas) break; // não tem mais colunas
        if (digito >= 0 && digito <= 9) {
          leds[coluna][digito].classList.add("aceso");
        }
      }
    }

    // efeito de piscar antes de mostrar (opcional)
    function piscarLeds(duracao = 800) {
      const intervalo = setInterval(() => {
        for (let c = 0; c < colunas; c++) {
          for (let r = 0; r < linhas; r++) {
            if (Math.random() > 0.8) leds[c][r].classList.toggle("aceso");
          }
        }
      }, 100);

      setTimeout(() => {
        clearInterval(intervalo);
        limparLeds();
      }, duracao);
    }

    function executar() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      const op = document.getElementById("op").value;
      const ledNegativo = document.getElementById("ledNegativo");

      if (isNaN(n1) || (op !== "sqrt" && isNaN(n2))) {
        alert("Por favor, insira números válidos!");
        return;
      }

      let resultado = 0;
      switch (op) {
        case "add": resultado = n1 + n2; break;
        case "sub": resultado = n1 - n2; break;
        case "mul": resultado = n1 * n2; break;
        case "div":
          if (n2 === 0) { alert("Divisão por zero!"); return; }
          resultado = n1 / n2; break;
        case "sqrt": resultado = Math.sqrt(n1); break;
      }

      if (resultado < 0) ledNegativo.classList.add("aceso"); else ledNegativo.classList.remove("aceso");

      piscarLeds(700);
      setTimeout(() => {
        exibirNumero(resultado);
        document.getElementById("hud").innerText = `Resultado: ${resultado.toFixed(4).replace(/\.?0+$/, "")}`;
      }, 750);
    }
  </script>
</body>
</html>
